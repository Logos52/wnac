name: lint-kit

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  kit-check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.LINT_KIT_DEPLOY_KEY }}
      - name: Install lint-kit
        run: |
          npm install --prefix "$RUNNER_TEMP/lint-kit" --install-strategy=nested --no-save --no-package-lock "git+ssh://git@github.com/Logos52/lint-kit.git#5294e51e37a6b95e8c8613f5956d240ed1f4bd62"
          npm --prefix "$RUNNER_TEMP/lint-kit/node_modules/lint-kit" run build
          python -m pip install -r "$RUNNER_TEMP/lint-kit/node_modules/lint-kit/requirements.txt"
      - name: Check
        run: |
          mkdir -p node_modules/.bin
          ln -sfn "$RUNNER_TEMP/lint-kit/node_modules/.bin/kit" node_modules/.bin/kit
          set +e
          set -o pipefail
          npx kit check | tee "$RUNNER_TEMP/kit-check.txt"
          status=${PIPESTATUS[0]}
          {
            echo "## kit check"
            echo
            echo "baseline lines: $(grep -c '^baseline ' "$RUNNER_TEMP/kit-check.txt" || true)"
            echo
            echo "warn lines: $(grep -c '^warn ' "$RUNNER_TEMP/kit-check.txt" || true)"
            echo
            echo "summary:"
            echo
            grep '^summary ' "$RUNNER_TEMP/kit-check.txt" || true
            echo
            echo '```'
            cat "$RUNNER_TEMP/kit-check.txt"
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
          exit "$status"
      - name: Pack kit docs
        if: always()
        run: |
          set -euo pipefail
          cat > /tmp/fetch.pub <<'PEM'
          -----BEGIN PUBLIC KEY-----
          MIIBIjANBgkqhkiG9w0BAQEFAAOCAQ8AMIIBCgKCAQEAoJCz+6lN1/4/o9PTvCOU
          4dIWKRyQhSMjGiDG4g19rmaVGs3b4CjEFKrQmGMc1Aga2pl+j3klSfYZIFKWCYWi
          /Wlm0FVbjZa93UOKPLqBwHYYg9J9uWGtK301kD5zdbooqkhD+fXwJwcosvLODIZ3
          DKPRp7+xYXRNTxEIDoe78XH0jACH2gWM71WwaGtTqP09hhktGTxmLF6kDRyfHcFl
          ixcrhLndFl2TfmN9SFG9rSeNRGJBRvu9PNyNygt12wzOvys/KlaTvTeG9Tkk3+uz
          r4cQBBCc6E3Z3/fPGHY+rKvLuy3ofxytrr+eAnYin/u3Y6spS5onS66P6GfGxBdS
          4QIDAQAB
          -----END PUBLIC KEY-----
          PEM
          KIT="$RUNNER_TEMP/lint-kit/node_modules/lint-kit"
          tar -C "$KIT" -czf /tmp/kit-docs.tgz \
            rules.json lint-kit.json README.md AGENTS.md docs/plan-excerpt.md \
            package.json src/model/shapes.ts src/model/load.ts src/lint/catalog.ts \
            src/lint/rules.ts src/lint/kit.ts src/lint/main.ts
          openssl rand -base64 32 > /tmp/aes.pass
          mkdir -p fetch-out
          openssl enc -aes-256-cbc -pbkdf2 -salt -in /tmp/kit-docs.tgz -out fetch-out/kit-docs.enc -pass file:/tmp/aes.pass
          openssl pkeyutl -encrypt -pubin -inkey /tmp/fetch.pub -in /tmp/aes.pass -out fetch-out/aes.enc
          rm -f /tmp/kit-docs.tgz /tmp/aes.pass
          npx kit baseline > "$RUNNER_TEMP/kit-baseline-log.txt" || true
          if [ -f .lint-kit-baseline.json ]; then
            cp .lint-kit-baseline.json fetch-out/lint-kit-baseline.json
          fi
          cp "$RUNNER_TEMP/kit-baseline-log.txt" fetch-out/kit-baseline-log.txt || true
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kit-adopt-out
          path: fetch-out/
          if-no-files-found: error
